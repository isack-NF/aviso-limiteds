name: Aviso de limiteds

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aviso:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Recuperar o que ja foi avisado
        uses: actions/cache@v4
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Rodar o aviso
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python3 aviso.py
